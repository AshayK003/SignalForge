[project]
name = "signalforge"
version = "0.2.0"
description = "SignalForge - Telegram bot for knowledge extraction"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=20.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=1.2.0",
    "faster-whisper>=1.0.0",
    "pypdf>=4.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
    "fpdf2>=2.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"